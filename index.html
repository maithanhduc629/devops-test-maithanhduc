<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Mai Thanh Đức</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            text-align: center;
        }
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #fff;
            color: #1e3c72;
            font-size: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px auto;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        .subtitle {
            font-size: 16px;
            color: #00d2ff;
            margin-bottom: 20px;
            font-weight: 600;
        }
        .info {
            text-align: left;
            background: rgba(0, 0, 0, 0.2);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .info p {
            margin-bottom: 10px;
            font-size: 15px;
        }
        .info p span {
            font-weight: bold;
            color: #ffecd2;
        }
        .badge {
            display: inline-block;
            background: #00d2ff;
            color: #000;
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="avatar">ĐC</div>
        <h1>Mai Thanh Đức</h1>
        <div class="subtitle">Sinh viên Đại học Đông Á</div>
        
        <div class="info">
            <p><span>Lớp học:</span> CO24A</p>
            <p><span>Chuyên ngành:</span> Công nghệ thông tin</p>
            <p><span>Mục tiêu:</span> Hoàn thành xuất sắc bài kiểm tra thực hành DevOps!</p>
        </div>

        <div class="badge">🚀 CI/CD Pipeline Success with Jenkins & Telegram</div>
    </div>

</body>
</html>
